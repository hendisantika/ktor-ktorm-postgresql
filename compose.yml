services:
  postgres-sandbox:
    image: postgres:17.5-alpine3.22
    ports:
      - '5438:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_DB=ktor_postgres
      - POSTGRES_USER=yu71
      - POSTGRES_PASSWORD=53cret
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yu71 -d ktor_postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres-sandbox:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      # Reached over the Compose network, so the service name and the container port.
      - DB_URL=jdbc:postgresql://postgres-sandbox:5432/ktor_postgres
      - DB_USER=yu71
      - DB_PASSWORD=53cret
    restart: unless-stopped

volumes:
  postgres-data:
