name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Never let two runs stamp the README at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Testcontainers spins up PostgreSQL for the integration tests;
      # Docker is preinstalled on the ubuntu-latest runners.
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  dependency-submission:
    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    # Only on push: the graph is stored per branch, and pull_request runs cannot get write permission from forks.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

  update-readme-date:
    # Stamps the "Last Updated" date in the README with the date of the commit
    # that triggered this run. Pushes made with GITHUB_TOKEN do not start new
    # workflow runs, and [skip ci] keeps it harmless if that ever changes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch itself, not the detached commit, so the stamp can be pushed back.
          ref: ${{ github.ref_name }}

      - name: Stamp the README with the last commit date
        run: |
          date=$(git log -1 --format=%cs)
          perl -0pi -e "s/(## Last Updated\n\n)\d{4}-\d{2}-\d{2}/\${1}$date/" README.md

          if git diff --quiet -- README.md; then
            echo "README already reads $date, nothing to do."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: Stamp README last updated date as $date [skip ci] 📗🗓️🤖" -- README.md
          git push
